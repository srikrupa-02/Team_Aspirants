<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Buildrex AI | Codebase Intelligence Platform</title>
    
    <!-- SEO & Social Meta Tags -->
    <meta name="description" content="Buildrex AI: The ultimate AI-powered developer productivity platform. Analyze repositories, chat with your code, generate documentation, and assess skill gaps instantly." />
    <meta name="keywords" content="AI coding assistant, code analysis, repository intelligence, developer tools, codebase chat, RAG, software architecture" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://buildrex.ai/" />
    <meta property="og:title" content="Buildrex AI" />
    <meta property="og:description" content="Understand any codebase in minutes. AI-powered analysis, chat, and documentation generation." />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Buildrex AI" />
    <meta name="twitter:description" content="Understand any codebase in minutes. AI-powered analysis, chat, and documentation generation." />

    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Typography Imports -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Favicon (Optional placeholder) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <style>
      /* Critical CSS for initial loading state */
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0a0a0a;
        color: #ffffff;
        font-family: 'Plus Jakarta Sans', sans-serif;
        overflow-x: hidden;
      }
      #root {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!-- React Root Container -->
    <div id="root">
      <!-- Loading Skeleton (Optional fallback) -->
      <div style="display: flex; justify-content: center; align-items: center; height: 100vh; opacity: 0.5;">
        <div class="loader">Loading Buildrex...</div>
      </div>
    </div>

    <!-- React Application Entry Point -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- Global Error Handler -->
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        console.error('Global Error:', message, error);
        // In a production build, this could send data to a monitoring service
        return true;
      };
    </script>
  </body>
</html>
